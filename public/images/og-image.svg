<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="315" r="300" fill="#7C3AED" opacity="0.05" filter="url(#glow)"/>
  <circle cx="200" cy="100" r="150" fill="#A855F7" opacity="0.03" filter="url(#glow)"/>
  <circle cx="1000" cy="500" r="200" fill="#5B21B6" opacity="0.04" filter="url(#glow)"/>
  <!-- Grid pattern -->
  <g stroke="#7C3AED" stroke-width="0.5" opacity="0.04">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  <!-- Shield icon -->
  <path d="M600 80 L680 120 L680 240 Q680 360 600 420 Q520 360 520 240 L520 120 Z" fill="none" stroke="url(#primary)" stroke-width="3" opacity="0.15"/>
  <!-- DT large text -->
  <text x="600" y="340" font-family="Arial Black, Impact, sans-serif" font-size="180" font-weight="900" fill="url(#primary)" text-anchor="middle">DRILLTOWN</text>
  <text x="600" y="340" font-family="Arial Black, Impact, sans-serif" font-size="180" font-weight="900" fill="url(#accent)" text-anchor="middle" opacity="0.08" transform="translate(4, 4)"/>
  <!-- Tagline -->
  <text x="600" y="410" font-family="Arial, sans-serif" font-size="22" fill="#9ca3af" text-anchor="middle" letter-spacing="4">LE SERVEUR RP CHICAGO LE PLUS IMMERSIF</text>
  <!-- Divider -->
  <rect x="450" y="440" width="300" height="1" fill="url(#primary)" opacity="0.3"/>
  <!-- Stats -->
  <text x="600" y="490" font-family="Arial, sans-serif" font-size="14" fill="#A855F7" text-anchor="middle" opacity="0.7">FiveM  •  Roleplay  •  Chicago Drill</text>
  <!-- Bottom border -->
  <rect x="0" y="625" width="1200" height="5" fill="url(#primary)"/>
</svg>
