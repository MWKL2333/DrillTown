<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip">
      <rect x="0" y="0" width="512" height="512" rx="96"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#primary)" opacity="0.06"/>
  <rect x="40" y="40" width="432" height="432" rx="72" fill="none" stroke="url(#primary)" stroke-width="1.5" opacity="0.15"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.08"/>
  <!-- Shield shape -->
  <path d="M256 120 L368 172 L368 280 Q368 360 256 400 Q144 360 144 280 L144 172 Z" fill="url(#primary)" opacity="0.12" stroke="url(#primary)" stroke-width="1.5"/>
  <!-- Crown/star -->
  <path d="M256 160 L280 220 L345 220 L295 258 L315 325 L256 285 L197 325 L217 258 L167 220 L232 220 Z" fill="url(#accent)" opacity="0.2"/>
  <!-- DT text -->
  <text x="256" y="300" font-family="Arial Black, Impact, sans-serif" font-size="164" font-weight="900" fill="url(#primary)" text-anchor="middle" filter="url(#glow)">DT</text>
  <text x="256" y="300" font-family="Arial Black, Impact, sans-serif" font-size="164" font-weight="900" fill="url(#primary)" text-anchor="middle" opacity="0.15" transform="translate(0, 3)"/>
  <!-- Subtitle -->
  <text x="256" y="380" font-family="Arial, sans-serif" font-size="18" fill="#A855F7" text-anchor="middle" letter-spacing="8" opacity="0.8">DRILLTOWN</text>
  <!-- Corner accents -->
  <path d="M80 80 L120 80 L120 88 L88 88 L88 120 L80 120 Z" fill="#7C3AED" opacity="0.3"/>
  <path d="M432 80 L432 120 L424 120 L424 88 L392 88 L392 80 Z" fill="#7C3AED" opacity="0.3"/>
  <path d="M80 432 L80 392 L88 392 L88 424 L120 424 L120 432 Z" fill="#7C3AED" opacity="0.3"/>
  <path d="M432 432 L392 432 L392 424 L424 424 L424 392 L432 392 Z" fill="#7C3AED" opacity="0.3"/>
</svg>
